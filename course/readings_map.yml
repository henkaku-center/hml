        why: "Post-class reinforcement of Week 1's probability foundations."
      - citation: "Austerweil, J. A Narrative Introduction to Probability — Tutorial 2 Ch 0–1 (Getting Started, Python Basics)."
        url: https://josephausterweil.github.io/probintro/genjax/
        why: "Sets up GenJAX on Colab so students can hit the ground running in Week 2."
    optional: []
    presentation_candidates: []
    presenter: null
    presented: null

