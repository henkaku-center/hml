# Semester readings for Human and Machine Learning SP26 (Chiba Tech SDS).
#
# Source of truth for (a) weekly assigned readings, and (b) paper-presentation
# assignments. Consumed by the course website generator (docs/_build.py) to
# publish the reading list per-week.
#
# Schema (per week):
#   number:      Session number (1..12).
#   date:        Friday ISO date.
#   theme:       One-line topic for the week.
#   required:    Readings students must do pre-class. Each entry:
#                  citation:  plain-text author/year/title.
#                  pdf:       filename in resources/readings/ (optional)
#                  url:       external URL (optional; e.g. textbook chapters)
#                  why:       one-sentence purpose (shows on the website).
#                             STUDENT-FACING: describe pedagogical value
#                             in terms the student can act on. DO NOT
#                             include curation meta-notes (page counts,
#                             "instructor's own work", "shorter variant
#                             of...", "replacement for..."). Those belong
#                             in commit messages, not in the UI.
#   optional:    Same shape as `required`; not graded pre-class.
#   presentation_candidates:
#                Papers eligible for student paper-presentations in this week's
#                slot. Each entry is the same shape as `required`. Students
#                rank their top-3 via Slack (see docs/reading-game-plan.md).
#   presenter:   Name of the student presenting for this week, or null if
#                the week has no presenter (Weeks 1–3) or the slot hasn't
#                been filled yet.
#   presented:   Paper the presenter chose (one of presentation_candidates),
#                or null if not yet picked.
#
# Paper-presentation policy
# -------------------------
# - Weeks 4–12 each have a presentation slot (9 slots, 4 students).
# - Students DM Prof. Austerweil on Slack with their top-3 ranked papers.
#   The three can come from any of Weeks 4–12 — not tied to one week.
#   Deadline: Wed May 13 (Week 3). Assignments published Fri May 15.
# - Some weeks will have no presenter — that's fine. Those weeks skip
#   straight from lecture to discussion.
# - Full guidelines: presentation-guidelines.html (student-facing on the
#   course site).
#
# Modernization notes (added for SP26)
# ------------------------------------
# - SP25's core paper list is preserved as the backbone (Tenenbaum 1999, Daw
#   2005, Griffiths 2006, etc.). These are the papers the textbook and slides
#   are designed around, and they're the right pedagogical choice for an
#   intro course.
# - For weeks where a modern companion paper (2023-2026) meaningfully extends
#   the classic — especially weeks 11 (deep nets -> LLMs) and 12 (ethics ->
#   AI hyperrealism, conspiracy beliefs in AI) — the modern paper is listed
#   as an additional presentation candidate, not a replacement for the core.

weeks:
