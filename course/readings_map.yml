        pdf: Hoetal2021JEPGeneral.pdf
        why: "The full recursive-inference formalization of 'showing': communicative demonstration as belief-directed planning — the demonstrator solves a POMDP whose hidden state is the OBSERVER's belief. Prof. Austerweil's own work; the formal successor to the 2016 showing-vs-doing paper and the anchor for the lecture's legibility = recursive-POMDP block."
