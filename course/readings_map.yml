  - number: 4
    date: 2026-05-22
    theme: Bayesian generalization + hierarchical Bayes
    required:
      - citation: "Tenenbaum, J. B. (1999). Bayesian modeling of human concept learning. Advances in Neural Information Processing Systems (NeurIPS) 11."
        pdf: Tenenbaum99ConcLearn.pdf
        why: "Tenenbaum's Bayesian-generalization framework worked through the axis-aligned-rectangles task. Friday's math is a direct walk-through of this paper."
    optional:
      - citation: "Austerweil, J. A Narrative Introduction to Probability — Tutorial 3 Ch 5 (Mixture models)."
        url: https://josephausterweil.github.io/probintro/intro2/05_mixture_models/
        why: "Reading for pre-class: hierarchical Bayes intuition before the lecture."
    presentation_candidates:
      - citation: "Tenenbaum, J. B., & Xu, F. (2000). Word learning as Bayesian inference. Proc. CogSci."
        pdf: TenenbaumXu2000.pdf
        why: "Classic application of Bayesian generalization to word learning."
      - citation: "Kemp, C., Perfors, A., & Tenenbaum, J. B. (2007). Learning overhypotheses with hierarchical Bayesian models. Developmental Science, 10(3), 307–321."
        pdf: Kemp07.pdf
        why: "Canonical hierarchical-Bayes model of concept learning. Overhypotheses (shape bias, object/substance kinds) are the textbook example of hierarchical priors in cognition."
      - citation: "Hornsby, A. N., Evans, T., Riefer, P. S., Prior, R., & Love, B. C. (2020). Conceptual organization is revealed by consumer activity patterns. Computational Brain & Behavior, 3, 162–173."
        pdf: Hornsby2020_Article_ConceptualOrganizationIsReveal.pdf
