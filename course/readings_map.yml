        pdf: abbott_nips2012_randomWalk.pdf
        why: "Memory retrieval modeled as a random walk — concrete cognitive application of Markov chains on networks."
    optional: []
    presentation_candidates:
      - citation: "Griffiths, T. L., Steyvers, M., & Firl, A. (2007). Google and the mind: Predicting fluency with PageRank. Psychological Science, 18(12), 1069–1076."
        pdf: Griffiths2007.pdf
        why: "Uses the small-world structure of semantic networks and applies PageRank — a random-walk algorithm — to predict human fluency. A direct bridge from semantic-network structure to the Abbott 2012 random-walk-on-network model."
