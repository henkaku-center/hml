<h1 id="the-kahneman%E2%80%93tversky-cab-problem">The Kahneman–Tversky cab problem</h1>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="27" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="setup">Setup</h2>
<ul>
<li>A city has two cab companies: <strong>Blue</strong> and <strong>Green</strong>.</li>
<li><strong>85%</strong> of cabs are Green. <strong>15%</strong> are Blue.</li>
<li>At night, a hit-and-run happens. A witness says the cab was <strong>Blue</strong>.</li>
<li>The witness correctly identifies cab colors at night <strong>80%</strong> of the time.</li>
</ul>
<br />
<p><strong>What is the probability the cab was actually Blue?</strong></p>
<br />
<p><em>(Commit to a number before we compute.)</em></p>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="28" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="pass-2--the-area-diagram">Pass 2 — the area diagram</h2>
<p>Imagine 100 cabs.</p>
<ul>
<li><strong>Blue cabs:</strong> 15. Witness correctly says &quot;blue&quot; on 80% of them → <strong>12</strong>.</li>
<li><strong>Green cabs:</strong> 85. Witness incorrectly says &quot;blue&quot; on 20% of them → <strong>17</strong>.</li>
</ul>
<p>Total &quot;blue&quot; reports: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>12</mn><mo>+</mo><mn>17</mn><mo>=</mo><mn>29</mn></mrow><annotation encoding="application/x-tex">12 + 17 = 29</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">12</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">17</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">29</span></span></span></span>.</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mtext>Blue</mtext><mo>∣</mo><mtext>witness says Blue</mtext><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>12</mn><mn>29</mn></mfrac><mo>≈</mo><mn>0.41</mn></mrow><annotation encoding="application/x-tex">P(\text{Blue} \mid \text{witness says Blue}) = \frac{12}{29} \approx 0.41
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord text"><span class="mord">Blue</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">witness says Blue</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.0074em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3214em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">29</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">12</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.41</span></span></span></span></span></p><br />
<p><strong>Below 50%.</strong> The witness is <em>more likely wrong than right</em>, despite being 80% accurate.</p>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="29" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="pass-3--formal-bayes">Pass 3 — formal Bayes</h2>
<p>Hypotheses <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mo>∈</mo><mo stretchy="false">{</mo><mi>B</mi><mo separator="true">,</mo><mi>G</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">h \in \{B, G\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">h</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">G</span><span class="mclose">}</span></span></span></span>.   Observation <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>o</mi></mrow><annotation encoding="application/x-tex">o</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">o</span></span></span></span> = &quot;witness says Blue.&quot;</p>
<p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>B</mi><mo>∣</mo><mi>o</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>o</mi><mo>∣</mo><mi>B</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>P</mi><mo stretchy="false">(</mo><mi>B</mi><mo stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>o</mi><mo>∣</mo><mi>B</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>P</mi><mo stretchy="false">(</mo><mi>B</mi><mo stretchy="false">)</mo><mo>+</mo><mi>P</mi><mo stretchy="false">(</mo><mi>o</mi><mo>∣</mo><mi>G</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>P</mi><mo stretchy="false">(</mo><mi>G</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">P(B \mid o) = \frac{P(o \mid B)\,P(B)}{P(o \mid B)\,P(B) + P(o \mid G)\,P(G)}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">o</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.363em;vertical-align:-0.936em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.427em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal">o</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal">o</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal">G</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal">G</span><span class="mclose">)</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal">o</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mclose">)</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.936em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p><p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>=</mo><mfrac><mrow><mn>0.80</mn><mo>⋅</mo><mn>0.15</mn></mrow><mrow><mn>0.80</mn><mo>⋅</mo><mn>0.15</mn><mo>+</mo><mn>0.20</mn><mo>⋅</mo><mn>0.85</mn></mrow></mfrac><mo>=</mo><mfrac><mn>0.1 <h2 id="base-rate-neglect">Base-rate neglect</h2>

<p>Most people report something close to 80%.<br />
They anchor on the likelihood and ignore the prior.</p>
<p>Kahneman &amp; Tversky (1972); Bar-Hillel (1980).</p>
<p>Medical doctors fail this too, even for diagnoses <em>(Casscells, Schoenberger, Grayboys, 1978)</em>.</p>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="30" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="31" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="heuristics-and-biases">Heuristics and biases</h2>
<div class="cols">
<div>
<p><strong>Heuristic</strong><br />
A rule-of-thumb. Usually works. Cheap to apply.</p>
<p><strong>Bias</strong><br />
Systematic error introduced when a heuristic is misapplied.</p>
</div>
<div>
<p>Kahneman &amp; Tversky argued that the mind is full of heuristics — good enough for most everyday inference but <strong>wrong in predictable ways</strong> when base rates are extreme, evidence is unfamiliar, or causal structure is unusual.</p>
<p>This is a running theme for the semester.</p>
</div>
</div>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="32" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="synthesis--the-5-step-recipe">Synthesis — the 5-step recipe</h2>
<p><strong>This is the course's method.</strong></p>
<ol>
<li><strong>Formalize the problem</strong> people face.</li>
<li><strong>Formalize the knowledge</strong> they bring to it.</li>
<li><strong>Apply Bayes' rule</strong> — compute what an ideal learner would infer.</li>
<li><strong>Characterize the ideal learner's behavior.</strong></li>
<li><strong>Identify what knowledge and constraints</strong> must be assumed for model and human behavior to match.</li>
</ol>
<p>Every week we pick a different cognitive domain and run this loop.</p>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-class="divider" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" class="divider" data-marpit-pagination="33" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--class:divider;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40"><div class="eyebrow">Block 5 · 20 minutes</div>

<h2 id="what-is-genjax">What is GenJAX?</h2>
<p>Bayes' rule is easy to write. Enumerating hypothesis spaces by hand is <strong>not</strong>.</p>
<p>For continuous distributions you can't enumerate at all.</p>
<p><strong>GenJAX</strong> is a probabilistic programming language.<br />
You write the generative process as code. The machine does the enumeration and counting.</p>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="35" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="genjax-by-example">GenJAX by example</h2>
<pre><code class="language-python"><span class="hljs-keyword">import</span> genjax
<span class="hljs-keyword">from</span> genjax <span class="hljs-keyword">import</span> gen, flip

<span class="hljs-meta">@gen</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">chibany_day</span>():
    lunch = flip(<span class="hljs-number">0.5</span>) @ <span class="hljs-string">&quot;lunch&quot;</span>
    dinner = flip(<span class="hljs-number">0.5</span>) @ <span class="hljs-string">&quot;dinner&quot;</span>
    <span class="hljs-keyword">return</span> (lunch, dinner)
</code></pre>
<ul>
<li><code>@gen</code> — this is a generative model, not a regular function.</li>
<li><code>flip(0.5)</code> — a Bernoulli random variable.</li>
<li><code>@ &quot;lunch&quot;</code> — name the random choice so we can condition on it later.</li>
</ul>
<p><strong>This function IS the outcome space <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Ω</mi></mrow><annotation encoding="application/x-tex">\Omega</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Ω</span></span></span></span> from Block 3.</strong> Every call samples a point.</p>
<footer>Human and Machine Learning · Week 1</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="Human and Machine Learning · Week 1" data-theme="vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c" lang="C" data-marpit-pagination="36" style="--paginate:true;--footer:Human and Machine Learning · Week 1;--theme:vchjowoix6hk5njzgid7m2yxokbiuundr5d340929c;" data-marpit-pagination-total="40">
<h2 id="preemptive-callouts">Preemptive callouts</h2>
<ul>
<li>Use <code>flip(p)</code>, <strong>not</strong> <code>bernoulli(p)</code>. <code>bernoulli</code> takes a logit, not a probability.</li>
<li>The <code>@</code> operator here is <strong>not</strong> matrix multiplication. GenJAX overloads it.</li>
<li>Output displays as <code>Array(0, dtype=int32)</code>. Treat these as 0s and 1s.</li>
<li>Everything runs in <strong>Google Colab.</strong> No local installation.</li>
</ul>
<footer>Human and Machine Learning · Week 1</footer>
