project:
  type: default
  render:
    - "course/week*/week*-slides.qmd"

# Default format for every weekN-slides.qmd. Each week inherits these settings
# and can override per-file in its YAML frontmatter.
format:
  revealjs:
    # NOTE: theme is intentionally NOT set at project level. Quarto merges parent
    # and child `theme:` arrays, which made it impossible to pin Week 2 to its
    # frozen pre-five-tier SCSS. Each week's qmd must declare its own theme:
    #   theme: [dark, ../../sds-reveal/sds.scss]            # Week 3+ (synced, five-tier)
    #   theme: [dark, sds-reveal-week2.scss]                # Week 2 only (pinned)
    width: 960
    height: 540
    margin: 0.04
    slide-number: false
    controls: true
    progress: true
    history: false
    hash-type: number
    transition: none
    incremental: false
    code-overflow: wrap
    center: false
    # Speaker-notes HTML presenter: press 'S' in browser.
    # Notes also round-trip into PPTX's native speaker-notes pane.
    # EN↔JA language toggle (press L). Wrap parallel content in
    # ::: {.lang-en} ... ::: and ::: {.lang-ja} ... ::: divs.
    # Paths are resolved relative to each .qmd's file location; course
    # decks live under course/weekNN_*/ so ../../ reaches sds-reveal/.
    css: ../../sds-reveal/lang-toggle.css
    include-after-body:
      text: |
        <script src="../../sds-reveal/lang-toggle.js"></script>
        <script src="../../sds-reveal/fig-size.js"></script>
  pptx:
    slide-level: 2

execute:
  enabled: false          # no live code execution during render; decks are static

# Where rendered outputs land. Each week's files sit next to the .qmd.
output-dir: _build

# Resources each week's deck may reference (relative paths are resolved from
# the .qmd file location). The theme assets live at repo root.
resources:
  - "sds-reveal/"
